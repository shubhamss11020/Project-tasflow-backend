services:
  # 1. Express API Web Service
  - type: web
    name: taskflow-api
    env: node
    plan: free
    buildCommand: "npm install && npx prisma generate && npm run build"
    startCommand: "npx prisma db push --accept-data-loss && node dist/server.js"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: taskflow-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: taskflow-redis
          property: port
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL_DAYS
        value: 7
      - key: EMAIL_FROM
        value: TaskFlow Notifications <notifications@taskflow.dev>

  # 2. BullMQ Background Email Worker
  - type: worker
    name: taskflow-worker
    env: node
    plan: free
    buildCommand: "npm install && npx prisma generate && npm run build"
    startCommand: "node dist/workers/emailWorker.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: taskflow-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: taskflow-redis
          property: port
      - key: WORKER_CONCURRENCY
        value: 5
      - key: EMAIL_RATE_LIMIT_MAX
        value: 50
      - key: EMAIL_RATE_LIMIT_DURATION_MS
        value: 60000

# 3. PostgreSQL Database
databases:
  - name: taskflow-db
    plan: free
    databaseName: taskflow_db
    user: taskflow_user

# 4. Redis Cache / Queue Instance
# Note: On Render free tier, create a free Redis instance on Render or use Upstash Redis
